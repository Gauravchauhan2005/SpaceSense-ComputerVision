services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacesense-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spacesense-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
